name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/transcription
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/transcription/pyproject.toml
      - name: Install FFmpeg (needed by the audio conversion tests)
        run: choco install ffmpeg -y --no-progress
      - name: Install backend (no ASR extra: tests never download models)
        run: python -m pip install -e ".[api,mcp-server,dev]"
      - run: python -m ruff check app tests
      - run: python -m pytest -q

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
